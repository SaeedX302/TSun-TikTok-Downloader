<!doctype html>
<html lang="en" class="dark" data-platform="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131210" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TSun" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>TSun — TikTok downloader</title>
    <meta
      name="description"
      content="Download TikTok videos without watermark in HD, extract MP3 audio and save photo posts. Paste a direct link or the share message copied from the TikTok app. A native-feeling interface on Android, iOS and desktop."
    />
    <meta
      name="keywords"
      content="TikTok downloader, TikTok video download, no watermark, TikTok MP3, TikTok photo download, vm.tiktok.com, vt.tiktok.com, app share link"
    />
    <meta name="author" content="SaeedX302" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tiktokvideodownloder.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TSun" />
    <meta property="og:title" content="TSun — TikTok downloader" />
    <meta
      property="og:description"
      content="Save TikTok videos in HD without a watermark. Supports app share messages, short links, MP3 audio and photo posts."
    />
    <meta property="og:url" content="https://tiktokvideodownloder.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TSun — TikTok downloader" />
    <meta
      name="twitter:description"
      content="Paste any TikTok link — including the share message copied from the app — and download HD video, audio or photos."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tsun.theme.v1');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var isDark = stored ? stored === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          var forced = new URLSearchParams(window.location.search).get('ui');
          var platform = forced;
          if (platform !== 'android' && platform !== 'ios' && platform !== 'desktop' && platform !== 'web') {
            var ua = navigator.userAgent;
            platform = /Android/i.test(ua)
              ? 'android'
              : /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
                ? 'ios'
                : 'desktop';
          }
          if (platform === 'web') platform = 'desktop';
          document.documentElement.dataset.platform = platform;
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; padding: 2rem; text-align: center">
        TSun needs JavaScript enabled to download TikTok videos.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
